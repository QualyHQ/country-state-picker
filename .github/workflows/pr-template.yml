name: PR template

# Summary filled in, risk labels, size warning (standards pr-template.yml).
# Outside ci-gate: a body or label edit re-checks in seconds.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  template:
    uses: QualyHQ/standards/.github/workflows/pr-template.yml@1ff3e91a752bae5acdda53dc3022873cebb46716 # v1.22.1
